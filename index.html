 const acc=(p,n)=>[...Array(n)].map((_,i)=>`<details><summary>${T(p+'q'+(i+1))}</summary><p>${T(p+'a'+(i+1))}</p></details>`).join('');

 $('#cards').innerHTML=[['mic',1],['users',2],['shield',3],['flag',4],['layers',5],['radio',6]].map(([i,n])=>`<div class="card rv in"><div class="ib">${ic(i)}</div><b>${T('w'+n)}</b><span>${T('w'+n+'s')}</span></div>`).join('');
 $('#elist').innerHTML=[...Array(10)].map((_,i)=>`<div><span>${T('e'+(i+1))}</span><em>${T('e'+(i+1)+'s')}</em></div>`).join('');
 const nav=[['home','nav_home'],['about','nav_about'],['events','nav_events'],['gallery','nav_gallery',showG],['videos','nav_videos',showV],['contact','nav_contact']].filter(s=>s[2]===undefined||s[2]);
 $('#links').innerHTML=nav.map(s=>`<a href="#${s[0]}">${T(s[1])}</a>`).join('');
 $('#flinks').innerHTML=nav.map(s=>`<a href="#${s[0]}">${T(s[1])}</a>`).join('');
 renderMedia();
}
function renderMedia(){
 $('#gallery').hidden=!showG;$('#videos').hidden=!showV;
 if(showG){const g=$('#mg');
  if(!gi.length){g.className='';g.innerHTML=`<p class="empty">${T('g_e')}</p>`}
  else{g.className='mg';g.innerHTML=gi.map((x,i)=>{const c=esc(pick(x,'caption'));return `<figure class="rv in" data-i="${i}"><img loading="lazy" src="${esc(imgSrc(x.src))}" alt="${c||'Event photo'}" referrerpolicy="no-referrer">${c?`<figcaption>${c}</figcaption>`:''}</figure>`}).join('')}}
 if(showV){const v=$('#vg');
  if(!vi.length){v.className='';v.innerHTML=`<p class="empty">${T('v_e')}</p>`}
  else{v.className='vg';v.innerHTML=vi.map(x=>{const u=x.url,t=esc(pick(x,'title'));let m,d,md;
   if(m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/))md=`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1" title="${t}" loading="lazy" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
   else if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))md=`<iframe src="https://player.vimeo.com/video/${m[1]}" title="${t}" loading="lazy" allow="fullscreen;picture-in-picture" allowfullscreen></iframe>`;
   else if(d=driveId(u))md=`<iframe src="https://drive.google.com/file/d/${d}/preview" title="${t}" loading="lazy" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
   else if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u))md=`<video controls playsinline preload="metadata" src="${esc(u)}"></video>`;
   else{let h='';try{h=new URL(u).hostname.replace('www.','')}catch(e){}md=`<a class="vlink" href="${esc(u)}" target="_blank" rel="noopener"><small>${esc(h)}</small><b>${T('v_w')}</b></a>`}
   return `<div class="rv in"><div class="vbox">${md}</div>${t?`<h3>${t}</h3>`:''}</div>`}).join('')}}
}
const num=S.countryCode+S.phone,pretty='+'+S.countryCode+' '+S.phone.slice(0,5)+' '+S.phone.slice(5);
const tel='tel:+'+num;
const waMsg=()=>(L==='kn'&&S.whatsappMessageKn)||S.whatsappMessage||'Hello Harsha, I would like to enquire about hosting an event.';
function links(){
 $$('[data-call]').forEach(a=>{a.href=tel;if(a.hasAttribute('data-show'))a.textContent=pretty});
 $$('[data-wa]').forEach(a=>{a.href='https://wa.me/'+num+'?text='+encodeURIComponent(waMsg());a.target='_blank';a.rel='noopener'});
 $$('[data-mail]').forEach(a=>{a.href='mailto:'+S.email+'?subject=Event%20enquiry';if(a.hasAttribute('data-show'))a.textContent=S.email});
 const d=$('.dock');if(d)d.innerHTML=`<a href="${tel}">${T('call')}</a><a href="https://wa.me/${num}?text=${encodeURIComponent(waMsg())}" target="_blank" rel="noopener">${T('wa')}</a>`;
}
function applyLang(){
 document.documentElement.lang=L==='kn'?'kn':'en';document.title=T('title');
 $$('[data-t]').forEach(e=>e.innerHTML=T(e.dataset.t));
 $('#lang').textContent=L==='kn'?'English':'ಕನ್ನಡ';
 $('#fy').innerHTML='&copy; '+new Date().getFullYear()+' '+(L==='kn'?'ಹರ್ಷ ಹೆಗಡೆ ಕೊಂಡದಕುಳಿ':S.name);
 build();links();observe();so_();
}
$('#lang').hidden=LANGS.length<2;
$('#lang').onclick=()=>{if(LANGS.length<2)return;L=L==='kn'?'en':'kn';try{localStorage.setItem('lang',L)}catch(e){}applyLang()};
const lb=document.createElement('div');lb.className='lb';lb.innerHTML='<button class="x" aria-label="Close">&times;</button><button class="p" aria-label="Previous">&#8249;</button><img alt="" referrerpolicy="no-referrer"><button class="n" aria-label="Next">&#8250;</button>';document.body.appendChild(lb);let k=0;
const sh=i=>{if(!gi.length)return;k=(i+gi.length)%gi.length;lb.querySelector('img').src=imgSrc(gi[k].src);lb.classList.add('on')};
$('#mg').onclick=e=>{const f=e.target.closest('figure');if(f)sh(+f.dataset.i)};
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.p').onclick=()=>sh(k-1);lb.querySelector('.n').onclick=()=>sh(k+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')sh(k-1);if(e.key==='ArrowRight')sh(k+1)});
const dock=document.createElement('div');dock.className='dock';document.body.appendChild(dock);
const menu=$('#menu'),lk=$('#links');
const setM=o=>{lk.classList.toggle('open',o);menu.setAttribute('aria-expanded',o);$('#mi').setAttribute('d',o?'M6 6l12 12M18 6L6 18':'M4 8h16M4 16h16')};
menu.onclick=()=>setM(!lk.classList.contains('open'));lk.onclick=e=>{if(e.target.tagName==='A')setM(false)};
const isDark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const paint=()=>{$('#theme').innerHTML=ic(isDark()?'sun':'moon')};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paint();$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}paint()};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function observe(){$$('.rv:not(.in)').forEach(el=>io.observe(el))}
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('.links a').forEach(a=>a.classList.toggle('on',a.hash==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
function so_(){$$('main section[id]').forEach(s=>so.observe(s))}
applyLang();
</script></body></html>
